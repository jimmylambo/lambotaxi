version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: lambotaxi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lambotaxi
      POSTGRES_USER: lambotaxi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lambotaxi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lambotaxi_net

  # ── Flask backend ───────────────────────────────────────────────────────────
  app:
    build: .
    container_name: lambotaxi_app
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://lambotaxi:${DB_PASSWORD}@db:5432/lambotaxi
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TOKEN_EXPIRY_HOURS: 720
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lambotaxi_net

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: lambotaxi_nginx
    restart: unless-stopped
    ports:
      - "8080:80"      # Si el puerto 80 está ocupado, cambia a "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - lambotaxi_net

volumes:
  pgdata:

networks:
  lambotaxi_net:
    driver: bridge

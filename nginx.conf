events { worker_connections 1024; }

http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile     on;
    gzip         on;
    gzip_types   text/plain application/json application/javascript text/css text/html;
    client_max_body_size 10M;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=120r/m;

    upstream flask { server app:5000; }

    # ── HTTP — redirige a HTTPS (y sirve el challenge de certbot) ──────────
    server {
        listen 80;
        server_name _;

        # Challenge Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Todo lo demás → HTTPS
        # Comenta estas 3 líneas mientras no tengas dominio/SSL (para probar en local):
        # location / { return 301 https://$host$request_uri; }

        # Para pruebas en local sin SSL, descomenta esto:
        location / {
            proxy_pass         http://flask;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://flask;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
        }
    }

    # ── HTTPS — descomentar cuando tengas dominio y certificado ───────────
    # server {
    #     listen 443 ssl http2;
    #     server_name tudominio.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location / {
    #         proxy_pass         http://flask;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto https;
    #         proxy_read_timeout 120s;
    #     }
    #
